[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wafer-defect-clustering"
version = "2.0.0"
description = "Semiconductor wafer defect clustering with HDBSCAN, edge compensation, and automatic pattern classification"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "Michael Kennedy", email = "michael.patrick.kennedy@outlook.ie" }]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["clustering", "semiconductor", "wafer", "defect", "hdbscan", "pattern-classification", "fab", "yield"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Manufacturing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
  "numpy>=1.26,<3.0",
  "scikit-learn>=1.5,<1.7",
  "scipy>=1.14,<2.0",
  "plotly>=5.24,<6.0",
  "pandas>=2.2,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<6.0",
  "pytest-xdist>=3.6,<4.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.10,<2.0",
  "types-setuptools",
  "wheel",
  "pre-commit>=3.7,<4.0"
]
test = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<6.0"
]
docs = [
  "sphinx>=7.4,<9.0",
  "sphinxcontrib-mermaid",
  "myst-parser>=4.0,<5.0"
]
all = [
  "wafer-defect-clustering[dev]"
]

[project.urls]
Homepage = "https://github.com/kennedym-ds/enhanced_adaptive_dbscan"
Repository = "https://github.com/kennedym-ds/enhanced_adaptive_dbscan"
Issues = "https://github.com/kennedym-ds/enhanced_adaptive_dbscan/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["wafer_defect_clustering*"]

[tool.ruff]
line-length = 100
fix = true
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]
ignore = [
  "E203",  # whitespace before ':'
  "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
disallow_untyped_defs = false  # Start lenient, ratchet up later
no_implicit_optional = true
check_untyped_defs = true
exclude = ["build/", "dist/", "docs/"]

[[tool.mypy.overrides]]
module = [
  "numpy.*",
  "pandas.*", 
  "plotly.*",
  "sklearn.*",
  "hdbscan.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "-ra"
]
